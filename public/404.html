<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <style>
    :root{
      --xbolt-primary:#18181b;
      --xbolt-bg:#ffffff;
      --xbolt-surface:#ffffff;
      --xbolt-surface-alt:#fafafa;
      --xbolt-border:#e4e4e7;
      --xbolt-text:#18181b;
      --xbolt-text-muted:#52525b;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial; background:var(--xbolt-surface-alt); color:var(--xbolt-text)}
    a{color:inherit}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:100%;max-width:860px;background:var(--xbolt-surface);border:1px solid var(--xbolt-border);border-radius:24px;padding:32px;box-shadow:0 20px 60px -35px rgba(0,0,0,.25)}
    .badge{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:#f4f4f5;border:1px solid var(--xbolt-border);font-size:12px;font-weight:700;color:var(--xbolt-text-muted)}
    .code{margin-top:16px;font-size:64px;font-weight:900;letter-spacing:-.04em}
    .title{margin:10px 0 0;font-size:24px;font-weight:800}
    .msg{margin:10px 0 0;color:var(--xbolt-text-muted);line-height:1.6}
    .actions{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 16px;border-radius:14px;font-weight:800;text-decoration:none;border:1px solid var(--xbolt-border);background:var(--xbolt-surface)}
    .btn.primary{background:var(--xbolt-primary);border-color:var(--xbolt-primary);color:#fff}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="badge">Not found</div>
      <div class="code">404</div>
      <div class="title">Page not found</div>
      <p class="msg">The page you’re looking for doesn’t exist (or it may have moved).</p>
      <div class="actions">
        <a class="btn primary" href="/">Back to home</a>
        <a class="btn" href="javascript:history.length>1?history.back():window.location.href='/'">Go back</a>
      </div>
    </div>
  </div>
</body>
</html>
